[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openstack-vdi"
version = "0.2.0"
description = "Native OpenStack desktop launcher with RustDesk connections"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "openstacksdk>=4.0,<5",
  "platformdirs>=4,<5",
  "requests>=2.34.2",
]

[project.gui-scripts]
openstack-vdi = "openstack_vdi.app:main"

[dependency-groups]
dev = [{include-group = "broker"}, 
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-qt>=4.4,<5",
    "ruff>=0.11,<1",
]
build = ["pyinstaller>=6,<7"]
broker = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

