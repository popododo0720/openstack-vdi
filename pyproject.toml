[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openstack-vdi"
version = "0.1.0"
description = "Native OpenStack desktop launcher with RustDesk connections"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "openstacksdk>=4.0,<5",
  "platformdirs>=4,<5",
]

[project.gui-scripts]
openstack-vdi = "openstack_vdi.app:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.11,<1"]
build = ["pyinstaller>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

