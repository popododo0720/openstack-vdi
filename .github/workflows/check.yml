name: Test and package native client

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.13'
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: uv sync --frozen --group dev
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest -q
      - name: Build Windows client
        if: runner.os == 'Windows'
        run: uv run --frozen --group build python scripts/build.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: OpenStackVDI-Windows
          path: dist/OpenStackVDI/
          if-no-files-found: error

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { choco install innosetup --yes --no-progress }
          & $compiler installer/OpenStackVDI.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist/installer/*.exe | Get-FileHash -Algorithm SHA256 | Format-List | Out-File dist/installer/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: OpenStackVDI-Installer
          path: dist/installer/
          if-no-files-found: error
